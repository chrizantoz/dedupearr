name: ci
on: { push: { branches: [main], tags: ['v*'] }, pull_request: {}, workflow_dispatch: {}, schedule: [{ cron: '0 7 * * 1' }] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: "code quality: compile, pyflakes, ruff"
        run: python -m py_compile dedupearr.py tests/*.py && pip install -q pyflakes ruff && python -m pyflakes dedupearr.py tests/*.py && ruff check dedupearr.py tests
      - name: "backend: plain language, verdicts on the fake disk, API contract (records the UI fixtures)"
        run: python tests/plain_language.py && python tests/verdicts.py && python tests/api.py && python tests/sandbox_mode.py && python tests/clients.py && python tests/fixes.py && python tests/auth.py
      - name: "robustness: random disks, chaos, performance budget, one mutant a day"
        run: python tests/fuzz_disk.py 25 ${{ github.run_number }} && python tests/fuzz_clients.py 12 ${{ github.run_number }} && python tests/chaos.py && python tests/perf_budget.py && python tests/mutation_check.py
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: "UI bots: every button, mangled data, edge worlds, lints"
        run: cd uibot && npm install --silent && node ui_bot.js ../ui.html fixtures && node fuzz_ui.js ../ui.html fixtures 200 ${{ github.run_number }} && python3 lint_checks.py && python3 lint_buttons.py && python3 edge_fixtures.py && for c in tidy empty huge down errors live; do node ui_bot.js ../ui.html fixtures-edge/$c || exit 1; done
      - name: "real browser: phone + desktop, personas, screenshots"
        run: cd uibot && npx playwright install chromium-headless-shell >/dev/null && node browser_bot.js ../ui.html fixtures
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ui-screenshots, path: uibot/screens/*.png, if-no-files-found: ignore }
      - run: python uibot/make_site.py /tmp/site && test -s /tmp/site/index.html && test -s /tmp/site/demo.html
      - run: docker build -q -t dedupearr:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "dedupearr:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1", format: "table" }
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: ver
        run: echo "v=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with: { context: ., push: true, provenance: false, sbom: false, tags: "${{ steps.meta.outputs.tags }}", build-args: "VERSION=${{ steps.ver.outputs.v }}\nREVISION=${{ github.sha }}" }
