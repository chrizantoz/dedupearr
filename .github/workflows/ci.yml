name: ci
on: { push: { branches: [main], tags: ['v*'] }, pull_request: {}, workflow_dispatch: {}, schedule: [{ cron: '0 7 * * 1' }] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m py_compile dedupearr.py tests/*.py && pip install -q pyflakes && python -m pyflakes dedupearr.py tests/*.py
      - run: python tests/plain_language.py && python tests/verdicts.py && python tests/api.py
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: cd uibot && npm install --silent && node ui_bot.js ../ui.html fixtures && node fuzz_ui.js ../ui.html fixtures 200 ${{ github.run_number }} && python3 lint_buttons.py
      - run: docker build -q -t dedupearr:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "dedupearr:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1", format: "table" }
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: ver
        run: echo "v=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with: { context: ., push: true, provenance: false, sbom: false, tags: "${{ steps.meta.outputs.tags }}", build-args: "VERSION=${{ steps.ver.outputs.v }}\nREVISION=${{ github.sha }}" }
